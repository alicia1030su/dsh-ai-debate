name: CI

# 每一次推送和 PR 都跑：编译、类型检查、全部测试。
# 任何一步失败都会让这个检查变红，从而阻止合并。

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  verify:
    name: 编译与测试（Node ${{ matrix.node }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The test command uses `--experimental-transform-types`, which landed in
        # Node 22.7.0 — 22.6 (the previous entry here) cannot run it at all. 22.18 is
        # used as the oldest *maintained* 22.x, so the job tests a version people are
        # actually told to install rather than a long-dead one.
        #
        # 24 is the DSH runtime, so a break there would hit every real user first.
        node: ['22.18', '24']

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 编译（严格模式）
        run: node_modules/.bin/tsc -p tsconfig.json

      - name: 类型检查（含测试与脚本）
        run: node_modules/.bin/tsc -p tsconfig.test.json

      - name: 自动化测试
        run: |
          set -e
          # Globbed so a new test file cannot be silently skipped by a stale list.
          node --experimental-transform-types --test "test/**/*.test.ts"

      - name: 打包自检
        run: node scripts/pack.mjs

      # ## The source archive is built and scanned here too (v0.2.15 §五)
      #
      # It used to be produced only by the release workflow, so a broken packer or a leaked local
      # file would first be noticed when publishing. Building it on every push costs a second and
      # moves that discovery to the pull request.
      - name: 生成并扫描公开源码包
        run: |
          set -e
          node scripts/source-zip.mjs
          VERSION="$(node -p "require('./package.json').version")"
          SOURCE_ZIP="../dsh-ai-debate-source-${VERSION}.zip"
          # Independent scanner: it does not import the packer and uses its own rules, so a bug in
          # the allowlist cannot certify itself.
          node scripts/scan-archive.mjs "$SOURCE_ZIP"
          node scripts/scan-archive.mjs "dsh-ai-debate-${VERSION}.tgz"

      # ## Facts about the workflow itself (§五)
      #
      # A suite can be green while skipping files, and a release can be reachable from a branch.
      # Those are properties of the repository, so they are asserted rather than assumed.
      - name: CI 守卫检查
        run: node scripts/ci-guard.mjs --require-archive

      # ## 凭据扫描交给项目自己的脚本（v0.2.16）
      #
      # v0.2.15 这里是两条内联 `grep`。它和 `scripts/audit-leaks.mjs` 各写了一套规则，
      # 结果两套规则对「什么算 fixture」的答案不一致：审计脚本认得 `fixture-` 前缀，
      # 内联 grep 不认，于是 `test/v0215-source-zip-security.test.ts` 里那个假 Cookie
      # 直接把这一步判死。同一件事只能有一个判定来源，否则修好一边不代表另一边也对。
      - name: 确认没有把凭据提交进仓库
        run: node scripts/audit-leaks.mjs

      - name: 确认构建产物已提交（供 GitHub 直接安装）
        run: |
          # `set -e` matters here more than elsewhere: without it, a failing `git diff` followed by
          # a later successful command would let the step finish green while lib/ is stale — the
          # exact "green but nothing verified" shape this workflow exists to prevent.
          set -e
          if [ ! -f lib/index.js ]; then
            echo "::error::lib/index.js 不存在。用户从 GitHub 安装时需要它，请不要在提交里排除 lib/。"
            exit 1
          fi
          git diff --exit-code --stat lib/ || {
            echo "::error::提交里的 lib/ 与源码不一致，请本地重新运行构建并提交产物。"
            exit 1
          }
