name: Release

# 推送 v* 标签时：重新跑一遍全部检查 → 打包 → 校验 → 创建 GitHub Release 并附上 .tgz。
# 检查或打包失败时**不会**发布，避免发出一个装不上或没测过的版本。

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只构建和打包，不创建 Release
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 校验标签与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -e
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "标签版本：$TAG_VERSION"
          echo "包版本：  $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::标签 $GITHUB_REF_NAME 与 package.json 里的 $PKG_VERSION 不一致"
            exit 1
          fi

      - name: 编译（严格模式）
        run: node_modules/.bin/tsc -p tsconfig.json

      - name: 类型检查（含测试与脚本，棘轮）
        run: node scripts/test-typecheck.mjs

      # ## 红色测试必须让这一步变红（v0.2.18）
      #
      # `set -e` 管不了管道。bash 取的是管道**最后**一个命令的退出码，而 `tee`
      # 永远成功 —— 于是 `set -e` 加 `| tee` 的组合下，测试全红这一步照样绿，
      # 发布照样往下走。唯一会报警的是末尾那份交付状态报告（它确实检查了计数），
      # 但它跑在 `gh release create` **之后**，那时正式版本已经发出去了。
      #
      # `-o pipefail` 让管道返回最右侧的非零退出码，红测试会停在这一步。
      # `-u` 是因为变量名打错时会静默展开成空串，而空串在这里的含义恰好是
      # 「没有测试要跑」—— 那是最不该被当成正常的一种输入。
      #
      # 回归验证：test/v0218-no-swallowed-failure.test.ts 会真的用 bash 跑一遍
      # 这两种写法，断言旧写法退出 0、新写法退出非零；scripts/ci-guard.mjs
      # 第 9 节静态断言每一处管道都配了 pipefail。静态一条、动态一条，缺一不可：
      # 静态的改得掉，动态的证明真跑起来是什么行为。
      - name: 自动化测试
        run: |
          set -euo pipefail
          # Globbed so a new test file cannot be silently skipped by a stale list.
          # Tee'd to a file because the delivery status report reads the real counts from it;
          # re-deriving them from a summary string in YAML would be a second source of truth.
          node --experimental-transform-types --test "test/**/*.test.ts" 2>&1 | tee /tmp/test-output.log

      - name: 确认 lib/ 与源码一致
        run: |
          set -e
          git diff --exit-code --stat lib/ || {
            echo "::error::lib/ 与源码不一致，请先本地构建并提交产物"
            exit 1
          }

      - name: 打包并校验
        id: pack
        run: |
          # `-o pipefail` 在这里也是为了 `sha256sum | cut`：`cut` 拿到空输入照样退出 0，
          # 于是 `sha256sum` 失败时 SHA256 会变成空串写进发布说明和 Release 元数据。
          # 一个空的校验和比没有校验和更糟 —— 它看起来像已经校验过了。
          set -euo pipefail
          node scripts/pack.mjs
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TARBALL="dsh-ai-debate-${PKG_VERSION}.tgz"
          if [ ! -f "$TARBALL" ]; then
            echo "::error::没有生成 $TARBALL"
            exit 1
          fi
          SHA256="$(sha256sum "$TARBALL" | cut -d' ' -f1)"
          # 长度不对就停：下面的发布说明会把它印出来，空串或截断都是假证据。
          if ! printf '%s' "$SHA256" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::安装包的 SHA-256 不是 64 位小写十六进制：'$SHA256'"
            exit 1
          fi
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "打包完成：$TARBALL（$SHA256）"

          # The source archive is a release asset too: it is what a reader needs to
          # audit or rebuild, and it is produced by the same script a developer runs.
          #
          # --out . is not cosmetic. upload-artifact@v4 refuses any path containing `..`
          # ("Relative pathing '.' and '..' is not allowed"), so the archive has to land
          # inside the workspace to become an asset. The first tagged release failed here.
          node scripts/source-zip.mjs --out .
          SOURCE_ZIP="dsh-ai-debate-source-${PKG_VERSION}.zip"
          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "::error::没有生成 $SOURCE_ZIP"
            exit 1
          fi
          SOURCE_SHA256="$(sha256sum "$SOURCE_ZIP" | cut -d' ' -f1)"
          if ! printf '%s' "$SOURCE_SHA256" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::源码包的 SHA-256 不是 64 位小写十六进制：'$SOURCE_SHA256'"
            exit 1
          fi
          echo "source_zip=$SOURCE_ZIP" >> "$GITHUB_OUTPUT"
          echo "source_sha256=$SOURCE_SHA256" >> "$GITHUB_OUTPUT"
          echo "源码包完成：$SOURCE_ZIP（$SOURCE_SHA256）"

      # ## Independent scan before anything becomes an asset (v0.2.15 §五)
      #
      # The packer already refuses to write a leaking archive, but that is self-certification:
      # a wrong allowlist and a wrong self-check are the same bug. This scanner has its own rules
      # and never imports the packer, so it can disagree — which is the point.
      - name: 独立扫描发布产物
        run: |
          set -e
          node scripts/scan-archive.mjs "${{ steps.pack.outputs.tarball }}"
          node scripts/scan-archive.mjs "${{ steps.pack.outputs.source_zip }}"

      - name: CI 守卫检查
        run: node scripts/ci-guard.mjs --require-archive

      - name: 校验安装包内容
        run: |
          set -e
          TARBALL="${{ steps.pack.outputs.tarball }}"
          # 用 tar 独立确认一次，不依赖打包脚本自己的自检。
          tar -tzf "$TARBALL" > /tmp/contents.txt
          echo "--- 包内容 ---"
          cat /tmp/contents.txt
          for required in package/lib/index.js package/cordis.patch.yml package/README.md package/LICENSE; do
            if ! grep -qx "$required" /tmp/contents.txt; then
              echo "::error::安装包里缺少 $required"
              exit 1
            fi
          done
          if grep -qE 'package/(src|test|scripts|node_modules)/' /tmp/contents.txt; then
            echo "::error::安装包里混进了源码或依赖目录"
            exit 1
          fi
          echo "安装包内容校验通过"

      - name: 上传构建产物（所有触发方式都保存）
        uses: actions/upload-artifact@v4
        with:
          name: dsh-ai-debate-${{ steps.pack.outputs.version }}
          path: |
            ${{ steps.pack.outputs.tarball }}
            ${{ steps.pack.outputs.source_zip }}
          # 产物不存在就是失败。默认行为是「找不到文件只警告、步骤照旧成功」，
          # 那等于把「这一次到底有没有产出安装包」判成通过。
          if-no-files-found: error
          retention-days: 30

      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TARBALL="${{ steps.pack.outputs.tarball }}"
          SOURCE_ZIP="${{ steps.pack.outputs.source_zip }}"
          VERSION="${{ steps.pack.outputs.version }}"

          # ## 发布说明由一处代码生成，不在这里手拼
          #
          # 这里原来是 awk 截 CHANGELOG + 一串 echo 拼安装段。它在打标签之前从不执行，
          # 所以任何错误都要等一次真实发版才会暴露 —— v0.2.16 发布说明里的哈希与附件对不上，
          # 就是这样漏出去的，而那已经是一份公开的发布说明。
          #
          # scripts/release-dry-run.mjs 是同一段逻辑，CI 每次推送都会带 --emit 跑到 /tmp/notes.md
          # 走一遍（含哈希校验），到这一步只是把同样的结果写进 Release。
          node scripts/release-dry-run.mjs --emit /tmp/notes.md

          gh release create "v${VERSION}" "$TARBALL" "$SOURCE_ZIP" \
            --title "AI代吵架 v${VERSION}" \
            --notes-file /tmp/notes.md \
            --verify-tag

      # ## 交付状态报告（v0.2.17 §二）
      #
      # 这份 JSON 是本轮交付的事实记录：哪个提交、哪个标签、哪个 Run、两个附件各自的字节数与
      # 哈希。它由握着这些值的进程在发布当时写下，所以不会像 Markdown 报告那样自指 ——
      # v0.2.16 的验收文档写了「发布提交 f1c111c」，而标签实际指向 57ffec6，正是手写必然
      # 遇到的死角。
      #
      # `if: always()` 是有意的：发布失败时这份报告最有用，它记下失败在哪一阶段、怎么恢复。
      # 因此这里的 `continue-on-error` 不能加 —— 报告生成不了，说明这次交付连自证都做不到。
      - name: 生成交付状态报告
        if: always()
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -e
          if [ -f /tmp/test-output.log ]; then
            TESTLOG="--test-log /tmp/test-output.log"
          else
            TESTLOG=""
          fi
          node scripts/delivery-status-report.mjs \
            $TESTLOG \
            --note="发布产物由本次运行构建，哈希为本步骤现读磁盘计算"

      - name: 上传交付状态报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-status-${{ steps.pack.outputs.version || github.run_id }}
          # 两个参数缺一不可，v0.2.18 的正式发布就栽在这里：
          # upload-artifact@v4.4 起默认跳过隐藏文件，而报告写在 .ship/（点开头的目录）里，
          # 于是这一步什么也没传，却按「找不到文件只警告」的默认行为报告成功 ——
          # 日志里只有一行 ##[warning]No files were found，运行整体是绿的。
          # include-hidden-files 让它看得见 .ship/；if-no-files-found: error 让「报告不存在」
          # 成为失败。上传的职责就是「把报告传上去」，没传成却报告成功，
          # 等于把「有没有证据」判成通过。
          include-hidden-files: true
          if-no-files-found: error
          path: .ship/delivery-status-*.json
          retention-days: 90
